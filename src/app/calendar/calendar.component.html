<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Calendar</h2>
  
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <div class="p-4 flex justify-between items-center bg-gray-100">
        <button (click)="prevMonth()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">&larr;</button>
        <h3 class="text-lg font-semibold text-gray-700">{{ monthNames[currentMonth] }} {{ currentYear }}</h3>
        <button (click)="nextMonth()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">&rarr;</button>
      </div>
  
      <div class="grid grid-cols-7 gap-1 p-4 text-center">
        <div class="font-semibold text-gray-600" *ngFor="let day of days">{{ day }}</div>
      </div>
  
      <div class="grid grid-cols-7 gap-1 p-4 text-center">
        <div *ngFor="let day of calendarDays" class="p-2 border rounded" 
             [class.bg-blue-500]="day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()">
          {{ day }}
        </div>
      </div>
    </div>
  </div>
