<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Reports</h2>
  
    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
      <div class="bg-white shadow-md rounded-lg p-4 border-l-4 border-blue-500">
        <h3 class="text-lg font-semibold text-gray-700">Total Sales</h3>
        <p class="text-2xl font-bold text-gray-900">$12,345</p>
      </div>
      <div class="bg-white shadow-md rounded-lg p-4 border-l-4 border-green-500">
        <h3 class="text-lg font-semibold text-gray-700">New Users</h3>
        <p class="text-2xl font-bold text-gray-900">245</p>
      </div>
      <div class="bg-white shadow-md rounded-lg p-4 border-l-4 border-yellow-500">
        <h3 class="text-lg font-semibold text-gray-700">Orders</h3>
        <p class="text-2xl font-bold text-gray-900">1,234</p>
      </div>
      <div class="bg-white shadow-md rounded-lg p-4 border-l-4 border-red-500">
        <h3 class="text-lg font-semibold text-gray-700">Refunds</h3>
        <p class="text-2xl font-bold text-gray-900">12</p>
      </div>
    </div>
  
    <!-- Reports Table -->
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Amount</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let report of reports">
            <td class="px-6 py-4 whitespace-nowrap">{{ report.id }}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{ report.date }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span [ngClass]="getStatusClass(report.status)" class="px-2 py-1 text-xs font-semibold rounded">
                {{ report.status }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">${{ report.amount }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
